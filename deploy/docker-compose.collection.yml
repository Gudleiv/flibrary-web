# collection.db — на локальном томе, архивы остаются на шаре.
#
#   docker compose -f docker-compose.yml -f docker-compose.smb.yml \
#                  -f docker-compose.collection.yml up -d
#
# Зачем: поиск делает много случайных чтений collection.db, а SMB на них медленный
# (рецепт из docs/deploy.md, раздел «Если поиск по шаре тормозит»). Том `library` при этом
# нужен по-прежнему — из него берутся архивы книг.
#
# Том `collection` заполняется вручную, копией коллекционной БД:
#
#   docker volume create flibrary-web_collection
#   docker run --rm -v flibrary-web_collection:/collection \
#       -v /путь/к/FLibrary.db:/src.db:ro alpine cp /src.db /collection/collection.db
#
# Копию нужно обновлять после каждого обновления коллекции — иначе будут находиться книги,
# которых в архивах уже нет.

services:
  api:
    environment:
      COLLECTION_DB: /collection/collection.db
      # Базовый compose рассчитан на домен с TLS и всегда ставит куке Secure. При
      # SITE_ADDRESS=http://... такая кука не возвращается ничем, кроме браузера на
      # localhost (его браузеры считают доверенным origin), — то есть по LAN-адресу и из
      # curl вход молча не работает. Защищать нечего: TLS в этой раскладке нет вообще.
      # Возвращать в 'true' одновременно с переездом на https.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - collection:/collection:ro

  opds:
    environment:
      COLLECTION_DB: /collection/collection.db
      # У flibusta картинки вынесены из fb2 в отдельные архивы (covers/, images/) — это то,
      # что FLibrary называет «дополнительными» файлами. Базовый compose эту переменную не
      # задаёт; здесь она прокинута, чтобы включать восстановление картинок из .env.
      ADDITIONAL_DIR: ${ADDITIONAL_DIR:-}
    volumes:
      - collection:/collection:ro

volumes:
  collection:
