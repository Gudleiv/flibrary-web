# Продовая раскладка: Caddy (TLS + статика) → api (Node) → flibrary-opds (C++).
#
# Рассчитана ровно на один сценарий: Linux-машина с Docker, всё остальное — на её дисках.
# Сетевых хранилищ (SMB и прочих шар) в раскладке нет намеренно — почему, в
# `docs/decisions.md`, решение 12.
#
# Ключевое:
#
#  * C++-сервер не публикует портов наружу вообще. Он внутренний content-service, к нему
#    обращается только api по внутренней сети compose.
#  * Библиотека — два каталога с хоста, оба read-only и в api, и в opds: `LIBRARY_PATH`
#    с архивами книг и `COLLECTION_PATH` с `collection.db`. Порознь, потому что база
#    выигрывает от быстрого локального диска, а архивы могут лежать на медленном большом
#    (см. `docs/decisions.md`, решение 12); лежат в одном каталоге — обе переменные
#    указывают на него.
#  * Наши данные (app.db, кэш обложек) — каталоги на хосте, `APP_PATH` и `CACHE_PATH`:
#    бэкапится обычным `cp`. Сертификаты Caddy — именованные тома, их не трогают.
#  * Ничего не нужно собирать на хосте: и api, и SPA собираются в образах.
#
# Переменные — в `.env` рядом с этим файлом, шаблон в `.env.example`.

name: flibrary-web

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      # Если TLS терминирует внешний прокси, Caddy на 443 не слушает (`SITE_ADDRESS=:80`),
      # но порт всё равно публикуется. Занят на хосте — задайте другой: `HTTPS_PORT=8443`.
      - '${HTTPS_PORT:-443}:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      COLLECTION_DB: /collection/${COLLECTION_FILE:-collection.db}
      APP_DB: /var/lib/flibrary-web/app.db
      CACHE_DIR: /var/cache/flibrary-web
      CONTENT_SERVICE_URL: http://opds:12791
      # Та же папка, что и у opds: из неё читаются отзывы читателей (reviews/).
      ADDITIONAL_DIR: ${ADDITIONAL_DIR:-}
      SESSION_SECRET: ${SESSION_SECRET:?задайте SESSION_SECRET, например openssl rand -hex 32}
      # По умолчанию раскладка с доменом и TLS, поэтому кука Secure. Если сервис открыт по
      # HTTP (LAN-адрес без домена), такую куку браузер молча выбрасывает — вход «не
      # работает» без единой ошибки в логах, и тогда нужен COOKIE_SECURE=false в .env.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      # Коллекция — только чтение: её схемой владеет FLibrary.
      #
      # Длинный синтаксис ради `create_host_path: false`: при обычном bind-mount опечатка в
      # пути молча создаёт пустой каталог от root, и разбираться приходится уже с
      # «коллекция не открывается».
      - type: bind
        source: ${COLLECTION_PATH:?укажите COLLECTION_PATH — каталог с collection.db}
        target: /collection
        read_only: true
        bind:
          create_host_path: false
      # Архивы нужны api не для книг (их отдаёт opds), а ради ADDITIONAL_DIR: отзывы
      # читателей — 7z-архивы, которые api распаковывает сам.
      - type: bind
        source: ${LIBRARY_PATH:?укажите LIBRARY_PATH — каталог с архивами книг}
        target: /library
        read_only: true
        bind:
          create_host_path: false
      # А это, наоборот, каталоги на запись, и create_host_path нужен: пусть создаются сами.
      - ${APP_PATH:-./data/app}:/var/lib/flibrary-web
      - ${CACHE_PATH:-./data/cache}:/var/cache/flibrary-web
    depends_on:
      - opds

  # Внутренний content-service: обложки, файлы книг, конвертеры форматов.
  # Образ собирается из официальной портативной сборки релиза, см. opds.Dockerfile.
  opds:
    build:
      context: .
      dockerfile: opds.Dockerfile
      args:
        FLIBRARY_VERSION: ${FLIBRARY_VERSION:-2.6.6}
    restart: unless-stopped
    # Портов наружу нет: доступен только по внутренней сети.
    expose:
      - '12791'
    environment:
      COLLECTION_NAME: ${COLLECTION_NAME:-collection}
      COLLECTION_DB: /collection/${COLLECTION_FILE:-collection.db}
      ARCHIVES_DIR: /library
      # «Дополнительные» файлы FLibrary — вынесенные из fb2 картинки (covers/, images/),
      # как у flibusta. Пусто, если картинки лежат внутри книг.
      ADDITIONAL_DIR: ${ADDITIONAL_DIR:-}
    volumes:
      # Тоже read-only: /Images/* (обложки и файлы книг — всё, что мы проксируем) на
      # read-only коллекции работают. Ценой отключается OPDS-каталог самого C++-сервера:
      # ему нужно создать представление Books_View_Opds, то есть запись. Если нужен OPDS
      # для читалок — уберите `read_only: true` у /collection (см. docs/deploy.md).
      - type: bind
        source: ${COLLECTION_PATH:?укажите COLLECTION_PATH — каталог с collection.db}
        target: /collection
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LIBRARY_PATH:?укажите LIBRARY_PATH — каталог с архивами книг}
        target: /library
        read_only: true
        bind:
          create_host_path: false

volumes:
  caddy-data:
  caddy-config:
