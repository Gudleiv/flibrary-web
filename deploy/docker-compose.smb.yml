# Библиотека лежит на SMB-шаре (NAS, машина с десктопным FLibrary — что угодно).
#
#   docker compose -f docker-compose.yml -f docker-compose.smb.yml up -d --build
#
# Оверрейд подменяет только том `library`: сервисы его не различают, для них это по-прежнему
# read-only каталог `/library` с collection.db и архивами.
#
# Что нужно знать:
#
#  * Монтирует шару демон Docker на хосте, а не контейнер, поэтому на хосте должен быть
#    установлен cifs-utils (`apt install cifs-utils`) и загружаемый модуль ядра cifs.
#    Внутри контейнеров ничего дополнительного не нужно и CAP_SYS_ADMIN не требуется.
#  * `nobrl` обязателен: SQLite берёт fcntl-блокировки даже на чтение, а через CIFS они
#    превращаются в серверные byte-range locks и в лучшем случае тормозят, в худшем — падают
#    с SQLITE_BUSY/IOERR. Том смонтирован ro и писателей нет, так что блокировки не нужны.
#  * `vers` лучше задавать явно: автонеговорка с некоторыми NAS выбирает SMB1.
#  * Пароль в `.env` — это файл на диске, `chmod 600 .env`. Альтернатива: положить на хост
#    файл с credentials (`username=`/`password=` двумя строками, chmod 600) и заменить в
#    строке `o:` пару username/password на `credentials=/путь/к/файлу` — читает его демон
#    Docker на хосте, поэтому путь хостовый.
#  * Поиск делает много случайных чтений collection.db. Если он на шаре и медленный —
#    держите на шаре только архивы, а collection.db копируйте на локальный том
#    (рецепт — в docs/deploy.md).

volumes:
  library:
    driver: local
    driver_opts:
      type: cifs
      device: //${SMB_HOST:?укажите SMB_HOST}/${SMB_SHARE:?укажите SMB_SHARE}${SMB_PATH:-}
      o: username=${SMB_USER:?укажите SMB_USER},password=${SMB_PASSWORD:?укажите SMB_PASSWORD},vers=${SMB_VERS:-3.1.1},ro,nobrl,iocharset=utf8,file_mode=0444,dir_mode=0555
